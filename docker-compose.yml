services:
  md2img:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: md2img-converter
    ports:
      - "5001:5000"
    environment:
      - PORT=5000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
